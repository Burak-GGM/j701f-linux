name: checks

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Host tools used by the C tests
        run: sudo apt-get update && sudo apt-get install -y clang patch
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

  wiki:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r wiki/requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/wiki-site

  # The wiki is published to GitHub Pages from main only, after the tests pass.
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, wiki]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
