name: checks

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Host tools used by the C tests
        run: sudo apt-get update && sudo apt-get install -y clang patch
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

  wiki:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r wiki/requirements.txt
      - run: mkdocs build --strict
