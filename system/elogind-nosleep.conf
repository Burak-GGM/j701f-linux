# Written by Claude 2026-10-09. Suspend/hibernate are untested on the mainline
# kernel of this phone; a failed resume would take it off the network. Refuse
# them until they have been tested with physical access.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
