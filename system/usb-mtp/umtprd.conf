# Written by Claude 2026-10-10 (roadmap 2, C). Installed as /etc/umtprd/umtprd.conf.
# uMTP-Responder: the computer sees the phone's home directory over USB (MTP).
loop_on_disconnect 1
# files the computer creates belong to the phone's user, not to root
default_uid 1000
default_gid 1000
umask 022
storage "/home/burak-alpine" "J701F" "rw"
manufacturer "Samsung"
product "SM-J701F Linux"
serial "j701f-linux"
firmware_version "Alpine"
interface "MTP"
# The identifiers of the whole USB device are set by the gadget in configfs
# (system/usb-mtp/start.sh adds only a function to it); these are not used there.
usb_vendor_id  0x04E8
usb_product_id 0x6860
usb_class 0x6
usb_subclass 0x1
usb_protocol 0x1
usb_dev_version 0x3008
usb_functionfs_mode 0x1
usb_dev_path   "/dev/ffs-mtp/ep0"
usb_epin_path  "/dev/ffs-mtp/ep1"
usb_epout_path "/dev/ffs-mtp/ep2"
usb_epint_path "/dev/ffs-mtp/ep3"
usb_max_packet_size 0x200
