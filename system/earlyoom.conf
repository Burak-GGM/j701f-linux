# /etc/conf.d/earlyoom - written by Claude 2026-10-10.
# When both free RAM and free swap are nearly gone, kill the biggest web
# renderer rather than let the whole desktop freeze. Never the compositor,
# the shell, the login manager or the audio daemons.
EARLYOOM_ARGS="-m 4 -s 8 -r 3600 --prefer '(^|/)(QtWebEngineProcess|firefox-esr|Web Content|Isolated Web Co)$' --avoid '(^|/)(kwin_wayland|plasmashell|sddm|sddm-helper|Xwayland|pipewire|wireplumber|sshd|elogind)$'"
